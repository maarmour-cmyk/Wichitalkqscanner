create table if not exists public.scanner_donor_condition (
  stock_number text primary key,
  vin text not null default '',
  impact_location text not null default 'None',
  severity text not null default 'None',
  flood boolean not null default false,
  fire boolean not null default false,
  interior_stripped boolean not null default false,
  notes text not null default '',
  updated_at timestamptz not null default now()
);

create table if not exists public.scanner_sales_learning (
  part_key text primary key,
  sales integer not null default 0,
  avg_actual_profit numeric,
  avg_days_to_sell numeric,
  actual_to_predicted_ratio numeric,
  learning_factor numeric not null default 1,
  updated_at timestamptz not null default now()
);

