name: Wichita LKQ V10 Background Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-background.txt
      - run: python background_scan.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_MIN_PART_PROFIT: '150'
          ALERT_MIN_DONOR_PROFIT: '400'
          ALERT_MIN_DWMT: '65'
          MAX_NEW_CARS_PER_RUN: '12'
          MAX_PARTS_PER_NEW_CAR: '6'
          EBAY_FEE: '0.13'
          EBAY_QUICK_SALE_PCT: '0.88'
